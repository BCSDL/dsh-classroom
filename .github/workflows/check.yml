name: Check plugin
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test test/worker-client.test.mjs
      - run: python test/worker.test.py
      - run: node --check lib/index.js
      - run: python -m py_compile backend/worker.py
      - run: npm pack --dry-run --ignore-scripts
